<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orsofey CRM</title>
<meta name="theme-color" content="#23262E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orsofey CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Тема «Неоморфизм 2.0» (тёмная): мягкие выпуклые и вдавленные формы из одного материала */
:root{
  color-scheme:dark;
  --bg:#23262E; --bg2:#23262E; --surface:#262A33; --deep:#1E2128;
  --sh-d:#16181D; --sh-l:#30353F;
  --up:9px 9px 20px var(--sh-d), -9px -9px 20px var(--sh-l);
  --up-sm:5px 5px 11px var(--sh-d), -5px -5px 11px var(--sh-l);
  --in:inset 5px 5px 10px var(--sh-d), inset -5px -5px 10px var(--sh-l);
  --in-sm:inset 3px 3px 6px var(--sh-d), inset -3px -3px 6px var(--sh-l);
  --glass:var(--surface); --glass-strong:var(--surface); --glass-line:rgba(255,255,255,.03);
  --line:rgba(255,255,255,.07);
  --ink:#E6E9EF; --ink2:#B4BAC7; --muted:#959CAB;
  --accent:#5EE0D2; --accent2:#9F8CFF; --accent-ink:#0E2A27; --accent-soft:rgba(94,224,210,.13);
  --bar:#5EE0D2; --bar-track:var(--deep);
  --good:#5EE0A6; --good-soft:rgba(94,224,166,.13);
  --warn:#FFB86B; --warn-soft:rgba(255,184,107,.12);
  --bad:#FF8FA3; --bad-soft:rgba(255,143,163,.12);
  --shadow:var(--up);
  --r:24px; --r-sm:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
/* мягкие стеклянные формы на фоне — скруглённые прямоугольники */
.bgfx{position:fixed; inset:0; z-index:-1; overflow:hidden; background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%)}
.bgfx i{position:absolute; border-radius:48px; filter:blur(50px); opacity:.55}
.bgfx i:nth-child(1){width:46vw;height:34vh;left:-8vw;top:-6vh;background:var(--accent2);transform:rotate(-12deg)}
.bgfx i:nth-child(2){width:40vw;height:30vh;right:-10vw;top:28vh;background:var(--accent);opacity:.28;transform:rotate(14deg)}
.bgfx i:nth-child(3){width:50vw;height:26vh;left:20vw;bottom:-10vh;background:var(--accent2);opacity:.3;transform:rotate(-6deg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.glass{background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%); border-radius:var(--r); box-shadow:var(--shadow)}
.app{display:flex; min-height:100vh}
nav.side{width:220px; padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px}
.brand{display:flex; align-items:center; gap:10px; padding:4px 10px 18px; font-weight:700; letter-spacing:.2px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--accent2),var(--accent));display:grid;place-items:center}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tab{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:0; background:none; cursor:pointer; color:var(--ink2); text-align:left; width:100%}
.tab svg{width:20px;height:20px;flex:none}
.tab.on{background:var(--glass-strong); color:var(--accent); font-weight:600; box-shadow:var(--shadow)}
.tab .badge{margin-left:auto}
main{flex:1; min-width:0; padding:22px 26px 40px; max-width:1180px}
.card,.kpi{min-width:0}
header.top{display:flex; align-items:center; gap:12px; margin-bottom:16px}
header.top h1{font-size:24px; margin:0; letter-spacing:-.3px}
header.top .sub{color:var(--muted); font-size:13px}
.spacer{flex:1}
.iconbtn{border:1px solid var(--glass-line); background:var(--glass); border-radius:12px; width:38px; height:38px; display:grid; place-items:center; cursor:pointer; color:var(--ink2)}
.iconbtn svg{width:18px;height:18px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.seg{display:inline-flex; padding:3px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-line); gap:2px; overflow-x:auto; max-width:100%}
.seg button{border:0; background:none; padding:6px 12px; border-radius:9px; cursor:pointer; color:var(--ink2); white-space:nowrap; font-size:14px}
.seg button.on{background:var(--glass-strong); color:var(--accent); font-weight:600; box-shadow:0 2px 8px rgba(31,92,170,.12)}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line); background:var(--glass); padding:6px 12px; border-radius:10px; cursor:pointer; white-space:nowrap; font-size:13.5px; color:var(--ink2)}
/* ---- иконки соцсетей: стеклянная плитка, знак в цвете бренда, «выпрыгивают» при появлении, блик при наведении ---- */
:root{--tt-ink:#fff; --x-ink:#fff}
.pic{--s:20px; position:relative; width:calc(var(--s) + 12px); height:calc(var(--s) + 12px); border-radius:32%; display:inline-grid; place-items:center;
  flex:none; vertical-align:middle; overflow:hidden; isolation:isolate;
  background:linear-gradient(145deg, rgba(255,255,255,.92), rgba(255,255,255,.55)); border:1px solid rgba(255,255,255,.7);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 6px 14px -6px var(--bcs, rgba(15,42,74,.25));
  transition:transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .4s; animation:pic-in .55s cubic-bezier(.34,1.56,.64,1) both; animation-delay:var(--d,0s)}
@media (prefers-color-scheme: dark){ .pic{background:linear-gradient(145deg, rgba(40,62,96,.95), rgba(22,38,62,.75)); border-color:rgba(255,255,255,.12);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 6px 16px -6px var(--bcs, rgba(0,0,0,.5))} }
.pic i{display:none; width:var(--s); height:var(--s); background:var(--bc); -webkit-mask-size:contain; mask-size:contain;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center}
.pic b{font-size:calc(var(--s) * .74); font-weight:800; line-height:1; letter-spacing:-.02em; background:var(--bc); -webkit-background-clip:text; background-clip:text; color:transparent}
.pic::after{content:""; position:absolute; inset:-30%; z-index:2; pointer-events:none;
  background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%); transform:translateX(-120%)}
.pic[data-si="tiktok"] i{filter:drop-shadow(1.1px 1.1px 0 #FE2C55) drop-shadow(-1.1px -1.1px 0 #25F4EE)}
.pic.sm{--s:14px; border-radius:30%} .pic.lg{--s:26px}
.pic:hover, .chip:hover .pic, .ptog:hover .pic, tr:hover .pic, .item:hover .pic, .setrow:hover > .row .pic{transform:translateY(-2px) rotate(-7deg) scale(1.1)}
.pic:hover::after, .chip:hover .pic::after, .ptog:hover .pic::after, tr:hover .pic::after, .item:hover .pic::after, .setrow:hover > .row .pic::after{animation:pic-shine .8s ease}
.chip.on .pic, .ptog.on .pic{animation:pic-in .55s cubic-bezier(.34,1.56,.64,1) both, pic-breathe 2.8s ease-in-out .6s infinite}
.chip .pic{margin:-5px 7px -5px -7px}
.ptog b .pic{margin:-4px 6px -4px 0}
@keyframes pic-in{from{transform:scale(.3) rotate(-25deg); opacity:0} to{transform:none; opacity:1}}
@keyframes pic-shine{to{transform:translateX(120%)}}
@keyframes pic-breathe{0%,100%{box-shadow:0 0 0 0 var(--bcs, transparent)} 55%{box-shadow:0 0 0 5px transparent}}
@media (prefers-reduced-motion: reduce){ .pic, .pic::after, .chip.on .pic, .ptog.on .pic{animation:none !important; transition:none} }
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
.grid{display:grid; gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:14px 16px}
.kpi .l{font-size:13px; color:var(--ink2)}
.kpi .v{font-size:28px; font-weight:700; letter-spacing:-.5px; margin-top:2px}
.kpi .h{font-size:12.5px; color:var(--muted); margin-top:2px}
.card{padding:16px 18px}
.card h2{font-size:16px; margin:0 0 4px}
.card .hint{color:var(--muted); font-size:13px; margin:0 0 12px}
.section{margin-top:14px}
.callout{display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:var(--r); background:var(--warn-soft); border:1px solid var(--line)}
.callout b{color:var(--ink)}
.callout .ico{width:30px;height:30px;border-radius:9px;background:var(--glass-strong);display:grid;place-items:center;flex:none;color:var(--warn)}
.btn{border:0; border-radius:12px; padding:9px 14px; cursor:pointer; font-weight:600; background:var(--accent); color:var(--accent-ink); white-space:nowrap}
.btn.ghost{background:var(--glass-strong); color:var(--accent); border:1px solid var(--glass-line)}
.btn.small{padding:6px 10px; font-size:13px; border-radius:10px}
.btn.danger{background:var(--bad-soft); color:var(--bad)}
.btn:disabled{opacity:.5; cursor:default}
/* воронка */
.fun{display:flex; flex-direction:column; gap:12px}
.fstep{display:grid; grid-template-columns:minmax(150px,220px) 1fr 72px; gap:12px; align-items:center}
.fstep .nm{font-size:14px}
.fstep .nm small{display:block; color:var(--muted); font-size:12px}
.track{position:relative; height:26px; border-radius:8px; background:var(--bar-track); overflow:hidden; cursor:default}
.fill{position:absolute; left:0; top:0; bottom:0; background:var(--bar); border-radius:4px 4px 4px 4px; min-width:3px}
.track .lab{position:absolute; left:10px; top:0; bottom:0; display:flex; align-items:center; font-weight:700; font-size:13.5px; color:var(--ink)}
.track .lab.inv{color:#fff}
.fstep .pct{text-align:right; font-weight:700}
.fstep .pct small{display:block; font-weight:500; color:var(--muted); font-size:11.5px; white-space:nowrap}
.seg.wrap{flex-wrap:wrap}
.fmeta{grid-column:2 / 4; display:flex; gap:6px; flex-wrap:wrap; margin-top:-6px}
.pill{font-size:12px; padding:3px 8px; border-radius:8px; background:var(--glass-strong); color:var(--ink2); border:1px solid var(--line); cursor:pointer; white-space:nowrap}
.pill.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.pill.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.pill.acc{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.tip{position:fixed; pointer-events:none; z-index:50; padding:8px 10px; border-radius:10px; font-size:12.5px; background:var(--glass-strong); border:1px solid var(--glass-line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:var(--shadow); display:none; max-width:260px}
table{width:100%; border-collapse:collapse; font-size:14px}
th{font-weight:600; color:var(--muted); font-size:12.5px; text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child, td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
/* списки */
.list{display:flex; flex-direction:column}
.item{display:flex; gap:12px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer}
.item:last-child{border-bottom:0}
.ava{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center; font-weight:700; color:var(--accent); background:var(--accent-soft)}
.item .main{flex:1; min-width:0}
.item .t{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .s{font-size:13px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .r{text-align:right; font-size:12.5px; color:var(--muted); flex:none}
.code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; padding:2px 6px; border-radius:7px; background:var(--accent-soft); color:var(--accent)}
.empty{padding:28px 10px; text-align:center; color:var(--muted)}
.search{flex:1; min-width:180px; padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:var(--glass-strong); outline:none}
.search:focus, .field:focus{border-color:var(--accent)}
select.field, input.field, textarea.field{width:100%; padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:var(--glass-strong); outline:none}
textarea.field{min-height:76px; resize:vertical}
label.f{display:block; font-size:13px; color:var(--ink2); margin:10px 0 4px}
/* контент */
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
.citem{padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.citem .top{display:flex; gap:8px; align-items:center}
.citem .ttl{font-weight:600; font-size:14.5px}
.citem .ttl.empty-t{color:var(--muted); font-weight:500; font-style:italic}
.nums{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
.nums span{overflow-wrap:anywhere}
.nums div{background:var(--glass-strong); border-radius:10px; padding:6px 8px; border:1px solid var(--line)}
.nums b{display:block; font-size:16px}
.nums span{font-size:11.5px; color:var(--muted)}
.mini{display:flex; gap:2px; height:6px; border-radius:3px; overflow:hidden; background:var(--bar-track)}
.mini i{background:var(--bar); display:block}
/* сделки */
.kanban{display:grid; grid-template-columns:repeat(5,minmax(170px,1fr)); gap:12px; overflow-x:auto; padding-bottom:6px}
.col{padding:12px; min-height:120px}
.col h3{font-size:14px; margin:0 0 8px; display:flex; justify-content:space-between}
.deal{padding:10px 12px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--line); margin-bottom:8px; cursor:pointer}
.deal .t{font-weight:600}
.deal .m{font-size:12.5px; color:var(--ink2); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
/* карточка человека */
.sheet-bg{position:fixed; inset:0; background:rgba(10,30,60,.32); z-index:40; display:none}
.sheet{position:fixed; z-index:41; right:0; top:0; bottom:0; width:min(560px,100%); overflow-y:auto; padding:18px 18px 40px; border-radius:22px 0 0 22px; display:none; background:var(--glass-strong); backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%); border-left:1px solid var(--glass-line); box-shadow:var(--shadow)}
.sheet.open,.sheet-bg.open{display:block}
.sheet h2{margin:0; font-size:20px}
.sheet .blk{margin-top:16px}
.sheet .blk > .lbl{font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px}
.steps{display:flex; flex-direction:column; gap:4px}
.st{display:flex; gap:10px; align-items:center; font-size:14px}
.st .dot{width:18px; height:18px; border-radius:6px; flex:none; display:grid; place-items:center; background:var(--bar-track); color:transparent; font-size:11px}
.st.done .dot{background:var(--accent); color:var(--accent-ink)}
.st .when{margin-left:auto; color:var(--muted); font-size:12.5px}
.st.miss{color:var(--muted)}
.timeline{display:flex; flex-direction:column; gap:8px}
.ev{font-size:13.5px; display:flex; gap:10px}
.ev .tm{color:var(--muted); font-size:12px; width:86px; flex:none}
.bub{padding:8px 11px; border-radius:14px; background:var(--glass); border:1px solid var(--line); white-space:pre-wrap; word-break:break-word}
.bub.me{background:var(--accent-soft); border-color:transparent}
.note{padding:8px 11px; border-radius:12px; background:var(--warn-soft); margin-bottom:6px; font-size:14px; white-space:pre-wrap; display:flex; gap:8px}
.note .x{margin-left:auto; cursor:pointer; color:var(--muted); border:0; background:none}
.toggle{position:relative; width:46px; height:28px; flex:none}
.accs{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.accrow{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--glass-strong); border:1px solid var(--line)}
.accs .accrow .main{flex:1 1 200px; min-width:0}
.accrow .t{font-weight:600; display:flex; align-items:center; gap:8px; min-width:0}
.accrow .t .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.accrow .t .pill{flex:none}
.accrow .s{font-size:12.5px; color:var(--ink2); margin-top:2px; word-break:break-word}
.accrow .acts{display:flex; align-items:center; gap:6px; flex:none}
.accrow .iconbtn{width:34px; height:34px; border-radius:10px}
.accrow .iconbtn svg{width:16px; height:16px}
.accrow .iconbtn.del{color:var(--bad)}
.accrow.off{opacity:.6}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.accbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px; border-radius:14px; background:var(--glass-strong); border:1px solid var(--line); margin:4px 0 6px}
.accbar .main{flex:1; min-width:220px}
.accbar .s{font-size:12.5px; color:var(--ink2); margin-top:2px}
.accrow{flex-wrap:wrap}
.accrow .acts{margin-left:auto}
.toggle input{opacity:0; width:0; height:0}
.toggle span{position:absolute; inset:0; border-radius:10px; background:var(--bar-track); transition:.2s; cursor:pointer; border:1px solid var(--line)}
.toggle span:before{content:""; position:absolute; width:22px; height:22px; left:2px; top:2px; border-radius:8px; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + span{background:var(--accent)}
.toggle input:checked + span:before{transform:translateX(18px)}
.setrow{display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .main{flex:1}
.setrow .s{font-size:12.5px; color:var(--muted)}
pre.report{white-space:pre-wrap; font:13px/1.5 inherit; background:var(--glass-strong); border-radius:12px; padding:12px; border:1px solid var(--line); margin:10px 0 0}

/* аналитика */
.kpis6{grid-template-columns:repeat(3,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.up{color:var(--good); font-weight:600}.down{color:var(--bad); font-weight:600}
.ins{display:flex; flex-direction:column; gap:8px}
.insi{display:flex; gap:10px; padding:10px 12px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--line); font-size:14px}
.insi.good{background:var(--good-soft); border-color:transparent}.insi.warn{background:var(--warn-soft); border-color:transparent}
.chartbox{position:relative; padding-top:16px}
.chartbox .ymax{position:absolute; top:0; left:0; font-size:11.5px; color:var(--muted)}
.chartbox svg.area{width:100%; display:block; height:auto; overflow:hidden}
.chartbox .axis{stroke:var(--line); stroke-width:1}
.chartbox .fillp{fill:var(--accent-soft)}
.chartbox .linep{fill:none; stroke:var(--bar); stroke-width:2; stroke-linejoin:round}
.chartbox .dotp{fill:var(--bar); stroke:var(--bg); stroke-width:2}
.chartbox .cross{position:absolute; top:16px; bottom:18px; width:1px; background:var(--muted); display:none; pointer-events:none}
.chartbox .xl{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:3px}
.multi{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-top:14px}
.minic{padding:10px 12px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--line); font-size:13.5px}
.pbadge{flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent)}
.vrow .vspark{flex:none}
.spark path{fill:none; stroke:var(--bar); stroke-width:1.6}
.vv{font-size:16px; font-weight:700; color:var(--ink); margin-bottom:3px}
/* публикация */
a.btn{text-decoration:none; display:inline-block}
.btn.big{padding:14px 18px; font-size:16px; border-radius:14px}
.postc{cursor:pointer; margin-bottom:10px; padding:14px 16px}
.drop{display:flex; align-items:center; justify-content:center; min-height:90px; border:2px dashed var(--line); border-radius:14px; cursor:pointer; font-weight:600; color:var(--accent); background:var(--glass); text-align:center; padding:12px}
.pvid{width:100%; max-height:300px; border-radius:12px; margin-top:10px; background:#0b1a2e}
.prog{height:8px; border-radius:4px; background:var(--bar-track); margin-top:10px; overflow:hidden}.prog i{display:block; height:100%; background:var(--bar); width:0; transition:width .2s}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px}
.ptog{border:1px solid var(--line); background:var(--glass); border-radius:12px; padding:10px 12px; text-align:left; cursor:pointer; color:var(--ink2)}
.ptog b{display:block; color:var(--ink)}.ptog span{font-size:12px}
.ptog.on{background:var(--accent); border-color:transparent}.ptog.on b,.ptog.on span{color:var(--accent-ink)}
.capbox{padding:10px; border-radius:12px; border:1px solid var(--line); margin-bottom:8px; background:var(--glass)}
.tcard{margin-top:12px; padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--glass)}
.tcard.warn{border-color:var(--warn)}.tcard.bad{border-color:var(--bad)}.tcard.good{background:var(--good-soft)}
.capshow{white-space:pre-wrap; font-size:13px; margin-top:6px; padding:8px 10px; border-radius:10px; background:var(--glass-strong)}
.asbar{display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 14px; margin-bottom:12px; border-radius:14px; background:var(--warn-soft); border:1px solid var(--line); font-size:14px}

/* превью постов */
.ptog.off{opacity:.45; cursor:not-allowed}
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.thumb{position:relative; width:76px; height:76px; border-radius:12px; overflow:hidden; background:var(--bar-track); display:block}
.thumb img,.thumb video{width:100%; height:100%; object-fit:cover; display:block}
.thumb .tstat{position:absolute; left:4px; bottom:4px; font-size:11px; padding:1px 5px; border-radius:6px; background:rgba(11,26,46,.7); color:#fff}
.thumb .tdel{position:absolute; right:4px; top:4px; border:0; width:22px; height:22px; border-radius:7px; background:rgba(11,26,46,.7); color:#fff; cursor:pointer; font-size:11px}
.pvwrap{margin-top:10px; display:flex; justify-content:center}
.pv{width:100%; max-width:360px; border-radius:16px; overflow:hidden; font:14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#14171a; background:#fff; border:1px solid rgba(0,0,0,.08); box-shadow:0 8px 24px rgba(15,42,74,.12)}
.pv .spacer{flex:1}
.pv-row{display:flex; align-items:center; gap:8px}
.pv-ava{width:32px; height:32px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:700; color:#fff; background:linear-gradient(135deg,#5cc8ff,#1f7cff); font-size:13px}
.pv-ava.ring{box-shadow:0 0 0 2px #fff, 0 0 0 4px #c9a5ff}
.pv-sub{color:#71767b; font-size:12.5px}
.pv-link{color:#1d72d8}
.pv-more{color:#8a8f94}
.pv-media{background:#0b1a2e; position:relative; overflow:hidden}
.pv-media img,.pv-media video,.pv-grid img,.pv-grid video{width:100%; height:100%; object-fit:cover; display:block}
.pv-media.r11{aspect-ratio:1/1}.pv-media.r45{aspect-ratio:4/5}.pv-media.r169{aspect-ratio:16/9}
.pv-media.tgm{border-radius:12px 12px 4px 4px; max-height:420px}
.pv-media.tgm img,.pv-media.tgm video{height:auto; max-height:420px; object-fit:contain}
.pv-grid{display:grid; gap:2px; background:#fff}
.pv-grid.n2{grid-template-columns:1fr 1fr}.pv-grid.n3{grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr}.pv-grid.n3>div:first-child{grid-row:1/3}
.pv-grid.n4{grid-template-columns:1fr 1fr}
.pv-grid>div{position:relative; aspect-ratio:1/1; overflow:hidden; background:#0b1a2e}
.pv-grid.n3>div:first-child{aspect-ratio:auto}
.pv-plus{position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.45); color:#fff; font-size:22px; font-weight:700}
.pv-count{font-size:12px; color:#71767b; padding:4px 12px 10px}
.pv-count.over{color:#d13f5c; font-weight:600}
/* Telegram */
.pv-tg{background:#c8dbe9; padding:10px; border:0}
.pv-blur img,.pv-blur video{filter:blur(18px) saturate(.6)}
.pv-blur{position:relative; overflow:hidden; border-radius:10px}
.pv-label{font-size:12.5px; background:#fff3e0; color:#8a4b00; border-radius:8px; padding:6px 8px; margin:6px 0}
.pv-tags{display:flex; flex-wrap:wrap; gap:4px; margin:8px 0}
.pv-tags span{font-size:12px; background:#eef2f7; color:#334; border-radius:6px; padding:2px 6px}
.pv-fa{background:#2e3b41; color:#e6e6e6}
.pv-fa .pv-sub{color:#a9b4b9}
.pv-fa .pv-tags span{background:#3d4d55; color:#dfe7ea}
.pv-fa-head{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.pv-fa-head b{flex:1}
.pv-fa-rate{font-size:11px; padding:2px 6px; border-radius:4px; background:#4caf50; color:#fff}
.pv-fa-rate.mature{background:#3f72d6}.pv-fa-rate.adult{background:#d33}
.pv-e6{background:#152f56; color:#fff}
.pv-e6 .pv-sub{color:#b4c7d9}
.pv-e6 .pv-tags span{background:#284a81; color:#b4c7d9}
.pv-e6-rate{font-size:12px; font-weight:700}
.pv-e6-rate.s{color:#3e9e49}.pv-e6-rate.q{color:#ffe666}.pv-e6-rate.e{color:#e45f5f}
.pv-dc{background:#313338; color:#dbdee1; padding:12px}
.pv-dc .pv-sub{color:#949ba4}
.pv-dc-bot{font-size:10px; background:#5865f2; color:#fff; border-radius:3px; padding:1px 4px; font-weight:700}
.pv-ava.dc{background:#5865f2}
.pv-pn .pv-media{border-radius:16px}
.pv-pn-save{background:#e60023; color:#fff; border-radius:20px; padding:6px 12px; font-weight:700; font-size:13px}
.pv-media.r23{aspect-ratio:2/3}
.pv-tg-head{display:flex; gap:8px; align-items:center; padding:2px 4px 10px}
.pv-tg-bubble{background:#fff; border-radius:12px; overflow:hidden; margin-bottom:6px; max-width:330px}
.pv-tg-text{padding:8px 10px 2px; white-space:normal; word-break:break-word}
.pv-tg-meta{font-size:11.5px; color:#8a9aa9; text-align:right; padding:2px 10px 6px}
.pv-tg-btn{background:rgba(255,255,255,.75); border-radius:10px; text-align:center; padding:8px; font-weight:600; color:#2a7ab5; max-width:330px}
.pv-tg-me{background:#e1fec6; border-radius:12px; padding:6px 10px; margin:0 0 8px auto; width:max-content; max-width:80%; font-size:14px}
.pv-doc{display:flex; gap:10px; align-items:center; padding:7px 10px}
.pv-doc+.pv-doc{border-top:1px solid #eef2f5}
.pv-doc i{flex:0 0 38px; height:38px; border-radius:50%; background:#3a9be0; color:#fff; display:grid; place-items:center; font-style:normal; font-size:16px}
.pv-doc b{display:block; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:230px}
.pv-doc small{color:#8a9aa9; font-size:12px}
.gift-files{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.gift-file{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:var(--glass2, rgba(255,255,255,.5)); border:1px solid var(--line, rgba(0,0,0,.06))}
.gift-file .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px}
.gift-file .sz{color:var(--muted); font-size:12px; white-space:nowrap}
.gift-file button{padding:4px 8px; min-width:0}
.giftlink{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.giftlink code{font-size:13px; word-break:break-all}
.gkpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:12px 0}
.gkpis div{padding:10px; border-radius:14px; background:var(--glass2, rgba(255,255,255,.45))}
.gkpis b{display:block; font-size:20px}
.gkpis span{font-size:12px; color:var(--muted)}
@media (max-width:560px){ .gkpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* Instagram */
.pv-ig .pv-row{padding:10px 12px}
.pv-icons{font-size:18px; gap:14px}
.pv-ig .pv-icons{padding:10px 12px 4px}
.pv-cap{padding:0 12px 4px; word-break:break-word}
.pv-dots{display:flex; gap:4px; justify-content:center; padding-top:8px}.pv-dots i{width:6px; height:6px; border-radius:50%; background:#c4c4c4}.pv-dots i.on{background:#1d9bf0}
/* TikTok и Shorts — вертикальный экран */
.pv-tt{position:relative; aspect-ratio:9/16; max-width:300px; background:#000; color:#fff; border:0}
.pv-tt .pv-media.fill{position:absolute; inset:0}
.pv-tt .pv-media.fill img{object-fit:contain; background:#000}
.pv-tt-side{position:absolute; right:8px; bottom:90px; display:flex; flex-direction:column; gap:14px; align-items:center; font-size:22px; text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pv-tt-side span{display:flex; flex-direction:column; align-items:center}
.pv-tt-side small{font-size:11px}
.pv-tt-cap{position:absolute; left:12px; right:56px; bottom:14px; font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,.7); word-break:break-word}
.pv-tt-cap .pv-link{color:#fff; font-weight:600}
.pv-tt-badge{position:absolute; top:10px; right:10px; background:rgba(0,0,0,.5); padding:2px 8px; border-radius:10px; font-size:12px}
.pv-sub-btn{background:#fff; color:#000; border-radius:14px; padding:3px 10px; font-size:12px; font-weight:600; white-space:nowrap}
.pv-tt-cap .pv-row b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
/* YouTube, VK, X, Patreon — карточки */
.pv-yt{padding:0 0 4px}
.pv-yt .pv-row{padding:0 12px}
.pv-yt-title{font-weight:600; font-size:15px; line-height:1.3}
.pv-desc{padding:8px 12px 0; font-size:13px; color:#4a4f54; word-break:break-word}
.pv-card{padding:12px}
.pv-card>.pv-media,.pv-card>.pv-grid{margin:10px -12px 0}
.pv-body{margin-top:8px; word-break:break-word}
.pv-card .pv-icons{margin-top:10px; font-size:15px; color:#536471}
.pv-x .pv-media,.pv-x .pv-grid{margin-top:10px; border-radius:14px; overflow:hidden}
.pv-x .pv-count{padding:6px 0 0}
.pv-pt-title{font-weight:700; font-size:17px; margin-top:12px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:90px; z-index:60; padding:10px 16px; border-radius:12px; background:var(--ink); color:var(--bg); font-weight:600; display:none}
/* вход */
.login{max-width:380px; margin:12vh auto 0; padding:26px}
.login h1{margin:0 0 6px; font-size:22px}
.codein{font-size:28px; letter-spacing:10px; text-align:center; font-weight:700}
nav.bottom{display:none}
.muted{color:var(--muted)}
.mt8{margin-top:8px}.mt12{margin-top:12px}
@media (max-width: 860px){
  nav.side{display:none}
  main{padding:14px 16px 100px}
  nav.bottom{display:flex; position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:30; padding:6px; justify-content:space-around}
  nav.bottom .tab{flex-direction:column; gap:2px; font-size:11px; padding:6px 4px; align-items:center; text-align:center}
  nav.bottom .tab.on{box-shadow:none}
  .kpis,.kpis6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three{grid-template-columns:1fr}
  .vrow .vspark{display:none}
  .kpi .v{font-size:23px}
  .fstep{grid-template-columns:1fr 78px; gap:6px 10px}
  .fstep .nm{grid-column:1 / 3}
  .fstep .track{grid-column:1 / 2}
  .fmeta{grid-column:1 / 3; margin-top:-2px}
  header.top h1{font-size:21px}
  .sheet{border-radius:22px 22px 0 0; top:6vh; width:100%}
  .kanban{grid-template-columns:repeat(5,minmax(240px,82vw))}
  .cgrid{grid-template-columns:1fr}
}

/* ===================== Неоморфизм 2.0 — компоненты ===================== */
body{font-family:Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg)}
.bgfx{background:var(--bg)}
.bgfx i{display:none}
.glass{background:var(--surface); border:1px solid var(--glass-line); border-radius:var(--r); box-shadow:var(--up); backdrop-filter:none; -webkit-backdrop-filter:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* каркас */
nav.side{width:240px; margin:20px 0 20px 20px; top:20px; height:calc(100vh - 40px); padding:22px 14px; gap:8px; border-radius:26px !important}
.brand{padding:4px 8px 22px; font-weight:800; font-size:16px}
.brand .mark{width:44px; height:44px; border-radius:50%; background:var(--surface); box-shadow:var(--up-sm)}
.brand .mark svg{width:22px; height:22px; stroke:var(--accent)}
.tab{min-height:48px; padding:0 16px; border-radius:16px; color:var(--ink2); font-weight:700; gap:14px; transition:color .2s, box-shadow .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--bg); color:var(--accent); font-weight:800; box-shadow:var(--in)}
main{padding:30px 32px 48px; max-width:1240px}
header.top{margin-bottom:22px}
header.top h1{font-size:32px; font-weight:800; letter-spacing:-.4px}
header.top .sub{font-size:14px; color:var(--ink2)}
.iconbtn{width:46px; height:46px; border-radius:14px; border:0; background:var(--surface); box-shadow:var(--up-sm); color:var(--ink2); transition:box-shadow .15s, color .15s}
.iconbtn:hover{color:var(--accent)}
.iconbtn:active{box-shadow:var(--in-sm)}

/* переключатели */
.seg{padding:5px; gap:4px; border-radius:16px; background:var(--bg); border:0; box-shadow:var(--in)}
.seg button{min-height:40px; padding:0 16px; border-radius:12px; color:var(--ink2); font-weight:700}
.seg button.on{background:var(--surface); color:var(--accent); font-weight:800; box-shadow:var(--up-sm)}
.chips{gap:12px; padding:6px 6px 14px; margin:0 -6px}
.chip{display:inline-flex; align-items:center; min-height:42px; padding:0 16px; border:0; border-radius:14px; background:var(--surface); box-shadow:var(--up-sm); color:var(--ink2); font-weight:700; font-size:14px}
.chip.on{background:var(--bg); color:var(--accent); box-shadow:var(--in-sm); font-weight:800}

/* кнопки */
.btn{min-height:44px; padding:0 20px; border-radius:14px; font-weight:800; background:linear-gradient(145deg,#6FE6D8,#3FB8AC); color:var(--accent-ink); box-shadow:var(--up-sm), inset 0 1px 0 rgba(255,255,255,.35); transition:box-shadow .15s, transform .15s}
.btn:active{box-shadow:var(--in-sm); transform:translateY(1px)}
.btn.ghost{background:var(--surface); color:var(--accent); border:0; box-shadow:var(--up-sm)}
.btn.ghost:active{box-shadow:var(--in-sm)}
.btn.small{min-height:36px; padding:0 14px; font-size:13px; border-radius:12px}
.btn.danger{background:var(--surface); color:var(--bad); box-shadow:var(--up-sm)}
.btn.big{min-height:54px; border-radius:16px}
a.btn{display:inline-flex; align-items:center; justify-content:center}

/* карточки и цифры */
.grid{gap:26px}
.section{margin-top:28px}
.card{padding:24px 26px}
.card h2{font-size:19px; font-weight:800; margin:0 0 6px}
.card .hint{color:var(--muted); font-size:13.5px; margin:0 0 18px}
.kpi{padding:22px 22px 20px; position:relative; overflow:hidden}
.kpi .l{font-size:14px; font-weight:700; color:var(--ink2)}
.kpi .v{font-size:32px; font-weight:800; margin-top:6px; letter-spacing:-.6px}
.kpi .h{font-size:13px; color:var(--muted); margin-top:4px}
.kpi::after{content:""; position:absolute; right:18px; top:18px; width:38px; height:38px; border-radius:50%;
  background:radial-gradient(circle, var(--kc, var(--accent)) 0 5px, transparent 6px), var(--bg); box-shadow:var(--in-sm), 0 0 0 0 transparent}
.kpis > .kpi:nth-child(4n+1), .kpis6 > .kpi:nth-child(6n+1){--kc:#9F8CFF}
.kpis > .kpi:nth-child(4n+2), .kpis6 > .kpi:nth-child(6n+2){--kc:#5EE0D2}
.kpis > .kpi:nth-child(4n+3), .kpis6 > .kpi:nth-child(6n+3){--kc:#FFB86B}
.kpis > .kpi:nth-child(4n+4), .kpis6 > .kpi:nth-child(6n+4){--kc:#FF8FB1}
.kpis6 > .kpi:nth-child(6n+5){--kc:#64B5F6}
.kpis6 > .kpi:nth-child(6n+6){--kc:#5EE0A6}
.kpi .l, .kpi .v, .kpi .h{padding-right:44px}
.callout{padding:16px 20px; border-radius:22px; background:var(--surface); border:0; box-shadow:var(--up)}
.callout .ico{width:44px; height:44px; border-radius:50%; background:var(--bg); box-shadow:var(--in-sm); color:var(--warn)}

/* воронка */
.fun{gap:18px}
.fstep{grid-template-columns:minmax(150px,220px) 1fr 76px; gap:16px}
.fstep .nm{font-weight:700}
.track{height:34px; border-radius:17px; background:var(--bg); box-shadow:var(--in)}
.fill{top:5px; bottom:5px; left:5px; border-radius:12px; min-width:10px; max-width:calc(100% - 10px); background:linear-gradient(90deg,#3FB8AC,#6FE6D8); box-shadow:3px 3px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35)}
.track .lab{left:16px; font-weight:800}
.track .lab.inv{color:var(--accent-ink)}
.fstep .pct{font-weight:800}
.fmeta{gap:8px; margin-top:-4px}
.pill{display:inline-flex; align-items:center; min-height:28px; font-size:12.5px; font-weight:700; padding:0 11px; border-radius:10px; background:var(--bg); color:var(--ink2); border:0; box-shadow:var(--in-sm)}
.pill.bad, .pill.good, .pill.warn, .pill.acc{background:var(--bg); box-shadow:var(--in-sm)}

/* таблицы и списки */
table{font-size:14.5px}
th{color:var(--muted); font-weight:700; font-size:12.5px; padding:8px 10px}
td{padding:13px 10px}
tbody tr{transition:background .15s}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.item{padding:13px 6px}
.ava, .pbadge{background:var(--bg); color:var(--accent); box-shadow:var(--in-sm); border-radius:50%}
.code{background:var(--bg); box-shadow:var(--in-sm); color:var(--accent)}

/* вложенные блоки — вдавлены в карточку */
.nums div, .insi, .minic, .accrow, .accbar, .capbox, .tcard, .capshow, pre.report, .gift-file, .gkpis div, .bub, .note{background:var(--bg); border:0; box-shadow:var(--in-sm)}
.nums div{border-radius:14px; padding:10px 12px}
.insi{border-radius:16px; padding:12px 14px}
.insi.good, .insi.warn{background:var(--bg)}
.insi.good{color:var(--ink)} .insi.good > span:first-child{color:var(--good)}
.accrow, .accbar{border-radius:18px; padding:12px 14px}
.accrow .iconbtn{width:38px; height:38px; border-radius:12px}
.bub.me{background:var(--deep); box-shadow:var(--in-sm)}
.note{background:var(--deep)}
.deal, .ptog{background:var(--surface); border:0; box-shadow:var(--up-sm); border-radius:16px}
.ptog{padding:12px 14px; transition:box-shadow .15s}
.ptog.on{background:var(--bg); box-shadow:var(--in-sm)}
.ptog.on b{color:var(--accent)} .ptog.on span{color:var(--ink2)}
.col{padding:14px}
.drop{background:var(--bg); border:2px dashed rgba(94,224,210,.35); box-shadow:var(--in); border-radius:18px}
.asbar{background:var(--surface); border:0; box-shadow:var(--up-sm); border-radius:18px}
.mini, .prog{background:var(--bg); box-shadow:var(--in-sm); height:8px; border-radius:4px}

/* поля ввода */
.search, select.field, input.field, textarea.field{min-height:46px; padding:10px 14px; border-radius:14px; border:0; background:var(--bg); box-shadow:var(--in); color:var(--ink)}
.search:focus, .field:focus{box-shadow:var(--in), 0 0 0 2px var(--accent)}
select.field option{background:var(--surface); color:var(--ink)}
label.f{font-weight:700; margin:14px 0 6px}
.toggle{width:54px; height:32px}
.toggle span{border-radius:16px; background:var(--bg); border:0; box-shadow:var(--in-sm)}
.toggle span:before{width:24px; height:24px; left:4px; top:4px; border-radius:50%; background:var(--surface); box-shadow:2px 2px 5px var(--sh-d), -1px -1px 3px var(--sh-l)}
.toggle input:checked + span{background:linear-gradient(145deg,#3FB8AC,#6FE6D8)}
.toggle input:checked + span:before{transform:translateX(22px); background:#E6FFFB}
.toggle input:focus-visible + span{outline:2px solid var(--accent); outline-offset:2px}
.setrow{padding:14px 0}

/* графики */
.chartbox .fillp{fill:url(#neuFill)}
.chartbox .linep{stroke:var(--accent); stroke-width:3; stroke-linecap:round}
.chartbox .dotp{fill:var(--accent); stroke:var(--surface); stroke-width:3}
.chartbox .axis{stroke:rgba(255,255,255,.06)}
.chartbox .cross{background:rgba(94,224,210,.5)}
.spark path{stroke:var(--accent); stroke-width:2}

/* всплывающее */
.tip{background:var(--surface); border:0; box-shadow:var(--up-sm); backdrop-filter:none; -webkit-backdrop-filter:none; border-radius:12px}
.sheet-bg{background:rgba(10,12,16,.55)}
.sheet{background:var(--surface); backdrop-filter:none; -webkit-backdrop-filter:none; border-left:0; box-shadow:-12px 0 30px var(--sh-d)}
.toast{background:var(--surface); color:var(--ink); box-shadow:var(--up); border-radius:16px}
.st .dot{background:var(--bg); box-shadow:var(--in-sm); border-radius:50%}
.st.done .dot{background:linear-gradient(145deg,#3FB8AC,#6FE6D8); box-shadow:none}

/* иконки соцсетей — мягкие кнопки */
.pic{background:var(--surface); border:0; border-radius:32%; box-shadow:3px 3px 7px var(--sh-d), -3px -3px 7px var(--sh-l)}
.pic::after{background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.18) 50%, transparent 62%)}
.chip .pic{margin:-6px 8px -6px -8px}
.chip.on .pic, .ptog.on .pic{animation:pic-in .55s cubic-bezier(.34,1.56,.64,1) both}

/* мобильная навигация */
@media (max-width: 860px){
  main{padding:18px 16px 110px}
  header.top h1{font-size:26px}
  nav.bottom{border-radius:22px; padding:8px; box-shadow:var(--up)}
  nav.bottom .tab{min-height:56px; border-radius:14px; font-weight:700}
  nav.bottom .tab.on{box-shadow:var(--in-sm)}
  .grid{gap:16px}
  .section{margin-top:20px}
  .card{padding:18px}
  .kpi{padding:16px}
  .kpi .v{font-size:25px}
  .kpi::after{width:28px; height:28px; right:12px; top:12px}
  .kpi .l, .kpi .v, .kpi .h{padding-right:30px}
  .seg button{padding:0 11px; font-size:13.5px}
  .chip{padding:0 13px}
  .callout{padding:14px}
}

/* ===================== Движение: плавные переходы ===================== */
@keyframes vt-up{from{opacity:0; transform:translateY(14px) scale(.985); filter:blur(3px)} to{opacity:1; transform:none; filter:none}}
@keyframes vt-fade{from{opacity:.25} to{opacity:1}}
@keyframes vt-pop{from{opacity:0; transform:translateY(-4px) scale(.97)} to{opacity:1; transform:none}}
#view, #subview{transition:opacity .16s ease, transform .16s ease}
.vt-out{opacity:0 !important; transform:translateY(6px)}
.vt-in > *{animation:vt-up .52s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 55ms)}
.vt-soft{animation:vt-fade .32s ease both}
.tip{animation:vt-pop .16s ease both}
details > :not(summary){animation:vt-up .38s cubic-bezier(.2,.8,.2,1) both}
summary{transition:color .2s}
summary:hover{color:var(--ink)}
.tab, .chip, .btn, .iconbtn, .ptog, .pill, .item, .deal, .accrow, .seg button, .toggle span, .toggle span:before, .search, .field, .glass{
  transition:box-shadow .3s ease, color .2s ease, background-color .3s ease, transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease}
.chip:hover, .ptog:hover, .deal:hover{transform:translateY(-1px)}
.chip:active, .ptog:active, .deal:active, .seg button:active, .tab:active{transform:scale(.97)}
.item:hover{background:rgba(255,255,255,.02)}
/* скользящая подложка у переключателей и меню */
.seg{position:relative; isolation:isolate}
.seg .seg-ind{position:absolute; top:5px; bottom:5px; left:0; width:0; border-radius:12px; background:var(--surface); box-shadow:var(--up-sm); z-index:-1; pointer-events:none;
  transition:transform .48s cubic-bezier(.2,.85,.25,1), width .48s cubic-bezier(.2,.85,.25,1), opacity .2s}
.seg.glide button.on{background:transparent; box-shadow:none}
nav.side, nav.bottom{isolation:isolate}
.nav-ind{position:absolute; left:0; top:0; border-radius:16px; background:var(--bg); box-shadow:var(--in); z-index:-1; pointer-events:none; opacity:0;
  transition:transform .5s cubic-bezier(.2,.85,.25,1), width .5s cubic-bezier(.2,.85,.25,1), height .5s cubic-bezier(.2,.85,.25,1), opacity .3s}
nav.glide .tab.on{background:transparent; box-shadow:none}
/* окна: карточка человека, затемнение, уведомления */
.sheet{display:block; visibility:hidden; transform:translateX(104%); transition:transform .5s cubic-bezier(.2,.85,.25,1), visibility 0s linear .5s}
.sheet.open{visibility:visible; transform:none; transition:transform .5s cubic-bezier(.2,.85,.25,1), visibility 0s}
.sheet-bg{display:block; opacity:0; pointer-events:none; transition:opacity .35s ease}
.sheet-bg.open{opacity:1; pointer-events:auto}
.toast{display:block; opacity:0; visibility:hidden; transform:translate(-50%, 16px) scale(.96);
  transition:opacity .25s ease, transform .4s cubic-bezier(.2,.85,.25,1), visibility 0s linear .4s}
.toast.show{opacity:1; visibility:visible; transform:translate(-50%, 0); transition:opacity .25s ease, transform .4s cubic-bezier(.2,.85,.25,1), visibility 0s}
.login{animation:vt-up .6s cubic-bezier(.2,.8,.2,1) both}
@media (max-width: 860px){
  .sheet{transform:translateY(104%)}
  .sheet.open{transform:none}
  .nav-ind{border-radius:14px}
}

/* ===================== Свет за курсором ===================== */
:root{--mx:-1000px; --my:-1000px; --glow-o:0}
.cursor-glow{position:fixed; inset:0; pointer-events:none; opacity:var(--glow-o); transition:opacity .6s ease}
.cursor-glow.back{z-index:-1; background:radial-gradient(620px circle at var(--mx) var(--my), rgba(94,224,210,.17), rgba(159,140,255,.09) 36%, transparent 70%)}
.cursor-glow.front{z-index:35; mix-blend-mode:screen; background:radial-gradient(360px circle at var(--mx) var(--my), rgba(94,224,210,.075), rgba(159,140,255,.03) 45%, transparent 72%)}
.glass{position:relative}
.glass::before{content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px; pointer-events:none; z-index:1;
  background:radial-gradient(300px circle at var(--mx) var(--my), rgba(110,240,225,.85), rgba(159,140,255,.4) 40%, transparent 72%) fixed;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
  opacity:var(--glow-o); transition:opacity .5s ease}
@media (hover: none), (pointer: coarse){ .cursor-glow, .glass::before{display:none} }
@media (max-width: 560px){ .row.exp{width:100%} .row.exp .muted{flex:1 1 100%} }
@media (prefers-reduced-motion: reduce){
  .vt-in > *, .vt-soft, .tip, details > :not(summary), .login{animation:none !important}
  .vt-out{transform:none}
  .sheet, .sheet.open, .toast, .toast.show{transition:visibility 0s, opacity .01s}
  .seg .seg-ind, .nav-ind{transition:none}
}
</style>
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div class="cursor-glow back" aria-hidden="true"></div>
<div class="cursor-glow front" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="neuFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EE0D2" stop-opacity=".34"/><stop offset="1" stop-color="#5EE0D2" stop-opacity="0"/></linearGradient></defs></svg>
<div id="root"></div>
<div class="tip" id="tip"></div>
<div class="sheet-bg" id="sheetbg"></div>
<aside class="sheet" id="sheet"></aside>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n ?? 0).toLocaleString("ru-RU");
const ICON = {
  funnel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="6" y="10" width="12" height="4" rx="1.5"/><rect x="9" y="16" width="6" height="4" rx="1.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10.5 9.5v5l4-2.5z"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><rect x="6.5" y="4" width="7" height="7.5" rx="3"/><path d="M20 20v-1.2a3.2 3.2 0 0 0-2.4-3.1M15.5 4.3a3.3 3.3 0 0 1 0 6.4"/></svg>',
  deal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="4"/><path d="M8 21h8M8 9.5h8M8 12.5h5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><rect x="14" y="5" width="4" height="4" rx="1.2"/><rect x="8" y="15" width="4" height="4" rx="1.2"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><rect x="5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="7" width="3" height="10" rx="1"/><rect x="16" y="4" width="3" height="13" rx="1"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M12 15V9M9 11.5 12 8.5l3 3"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  warn:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
};
const ALL_TABS = [["funnel","Воронка",ICON.funnel],["analytics","Аналитика",ICON.chart],["publish","Публикация",ICON.send],["people","Люди",ICON.people],["settings","Настройки",ICON.gear]];
const ALL_SUBS = {funnel:[["funnel","Воронка"],["gifts","Подарки по ссылке"]], analytics:[["overview","Обзор"],["videos","Ролики"],["labels","Метки"]], people:[["people","Люди"],["deals","Сделки"]]};
let TABS = ALL_TABS.slice(), SUBS = JSON.parse(JSON.stringify(ALL_SUBS));
const ALIAS = {deals:["people","deals"], content:["analytics","labels"], gifts:["funnel","gifts"]};
const PERIODS = [["today","Сегодня"],["7","7 дней"],["30","30 дней"],["all","Всё время"]];
const STATUS = [["","Все"],["stuck","Застряли"],["active","В процессе"],["paid","Оплатили"],["left","Ушли"],["lead","Личная работа"]];
const STATUS_PILL = {paid:"good", stuck:"bad", active:"acc", left:"warn"};

let S = {tab:"funnel", period:"30", platform:"all", meta:null,
  people:{status:"", stage:"", platform:"all", q:"", source:"", items:[], total:0}, token:null};
try{ S.tab = localStorage.getItem("crm_tab") || "funnel"; S.period = localStorage.getItem("crm_period") || "30"; }catch(e){}
try{ S.token = localStorage.getItem("crm_token"); }catch(e){}
// вход по ссылке из бота: #t=…
if (location.hash.startsWith("#t=")) {
  S.token = decodeURIComponent(location.hash.slice(3));
  try{ localStorage.setItem("crm_token", S.token); }catch(e){}
  history.replaceState(null, "", location.pathname);
}

async function api(path, body){
  const opt = {credentials:"same-origin", headers:{}};
  if (S.token) opt.headers.Authorization = "Bearer " + S.token;
  if (body !== undefined){ opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let data = {}; try{ data = await r.json(); }catch(e){}
  if (r.status === 401 && path !== "/api/login"){ renderLogin(); throw new Error("auth"); }
  if (!r.ok) throw new Error(data.error || ("Ошибка " + r.status));
  return data;
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2200); }
function ago(ts){
  if (!ts) return "—";
  const d = Date.now()/1000 - ts;
  if (d < 60) return "только что";
  if (d < 3600) return Math.floor(d/60) + " мин назад";
  if (d < 86400) return Math.floor(d/3600) + " ч назад";
  if (d < 86400*7) return Math.floor(d/86400) + " дн назад";
  return dateStr(ts);
}
function dateStr(ts, time=true){
  const d = new Date(ts*1000);
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}) + (time ? " " + d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) : "");
}
function initials(n){ return esc((n||"?").replace("@","").trim().slice(0,1).toUpperCase() || "?"); }
function money(stars, rub){
  const p=[]; if (stars) p.push(fmt(stars)+" ⭐"); if (rub) p.push(fmt(Math.round(rub))+" ₽");
  return p.join(" + ") || "0";
}
function botLink(code){ const u = S.meta?.bot_username; return u ? `https://t.me/${u}?start=${code}` : `?start=${code}`; }
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast("Скопировано"); }catch(e){ prompt("Скопируй:", t); } }

/* ---------------- Каркас ---------------- */
function shell(){
  const tabs = TABS.map(([k,n,i]) => `<button class="tab ${S.tab===k?"on":""}" data-tab="${k}">${i}<span>${n}</span></button>`).join("");
  $("#root").innerHTML = `
  <div class="app">
    <nav class="side glass" style="border-radius:0 22px 22px 0">
      <div class="brand"><div class="mark">${ICON.funnel.replace('stroke="currentColor"','stroke="#fff"')}</div><div>Orsofey CRM<small>воронка бота</small></div></div>
      ${tabs}
    </nav>
    <main><header class="top"><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="spacer"></div>
      <button class="iconbtn" id="refresh" title="Обновить">${ICON.refresh}</button></header>
      <div id="view"></div></main>
    <nav class="bottom glass">${tabs}</nav>
  </div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
  $("#refresh").onclick = () => render();
  VT.observe($("#view"), {childList:true});
  requestAnimationFrame(glideNav);
}
function go(tab, opts){
  if (ALIAS[tab]){ S.sub = S.sub || {}; S.sub[ALIAS[tab][0]] = ALIAS[tab][1]; tab = ALIAS[tab][0]; }
  S.tab = tab; try{ localStorage.setItem("crm_tab", tab); }catch(e){}
  if (opts) Object.assign(S.people, opts);
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  glideNav();
  vtOut("view");
  render(); window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function setTitle(t, sub=""){ $("#title").textContent = t; $("#subtitle").textContent = sub; }
async function render(){
  const v = $("#view"); if (!v) return;
  try{
    if (ALIAS[S.tab]){ go(S.tab); return; }
    if (!TABS.some(t=>t[0]===S.tab)) S.tab = "funnel";
    S.sub = S.sub || {};
    let target = v;
    if (SUBS[S.tab]){
      const cur = S.sub[S.tab] || SUBS[S.tab][0][0];
      if (!$("#subview") || v.dataset.tab !== S.tab){
        v.dataset.tab = S.tab;
        v.innerHTML = `<div class="seg" style="margin-bottom:14px">${SUBS[S.tab].map(([k,n])=>`<button data-sub="${k}" class="${cur===k?"on":""}">${n}</button>`).join("")}</div><div id="subview"></div>`;
        v.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{ if (S.sub[S.tab]===b.dataset.sub) return; S.sub[S.tab]=b.dataset.sub; vtOut("subview"); render(); });
        VT.observe($("#subview"), {childList:true});
      } else {
        v.querySelectorAll("[data-sub]").forEach(b=>b.classList.toggle("on", b.dataset.sub===cur));
        glideSegs(v);
      }
      target = $("#subview");
      if (S.tab==="funnel") await (cur==="gifts" ? viewGifts(target) : viewFunnel(target));
      else if (S.tab==="analytics") await (cur==="videos" ? viewVideos(target) : cur==="labels" ? viewContent(target) : viewAnalytics(target));
      else await (cur==="deals" ? viewDeals(target) : viewPeople(target));
    }
    else {
      v.dataset.tab = "";
      if (S.tab==="funnel") await viewFunnel(v);
      else if (S.tab==="publish") await viewPublish(v);
      else await viewSettings(v);
    }
  }catch(e){ if (e.message!=="auth"){ v.dataset.tab = ""; v.innerHTML = `<div class="glass card empty">Не загрузилось: ${esc(e.message)}</div>`; } }
  finally { vtDone(); }
}

/* ---------- плавные переходы ---------- */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
const VT_STRONG = new Set();
function vtOut(id){
  const el = document.getElementById(id); if (!el) return;
  VT_STRONG.add(id); el.classList.remove("vt-in","vt-soft"); el.classList.add("vt-out");
}
function animateIn(host, strong){
  host.classList.remove("vt-out","vt-in","vt-soft"); void host.offsetWidth;
  if (!REDUCED.matches){
    if (strong){ [...host.children].forEach((c,i)=>c.style.setProperty("--i", Math.min(i,10))); host.classList.add("vt-in"); }
    else host.classList.add("vt-soft");
  }
  glideSegs(host);
}
function vtDone(){ // если вид ничего не перерисовал целиком — всё равно показать
  ["view","subview"].forEach(id=>{ const el=document.getElementById(id); if (el && el.classList.contains("vt-out")){ VT_STRONG.delete(id); animateIn(el, false); } });
}
const VT = new MutationObserver(muts=>{
  const hosts = new Set(muts.filter(m=>m.addedNodes.length).map(m=>m.target));
  hosts.forEach(h=>{ if (!h.isConnected) return; const strong = VT_STRONG.delete(h.id); animateIn(h, strong); });
});
// скользящая подложка: помним, где она была, и плавно двигаем к новой кнопке даже после перерисовки
const SEG_POS = new Map();
function glideSegs(root){
  (root||document).querySelectorAll(".seg").forEach((seg,i)=>{
    const on = seg.querySelector("button.on"); if (!on) return;
    let ind = seg.querySelector(":scope > .seg-ind");
    const key = (S.tab||"") + ":" + (seg.closest("#sheet") ? "sheet" : seg.closest("#subview") ? "sub" : "view") + ":" + [...document.querySelectorAll(".seg")].indexOf(seg);
    const to = {x:on.offsetLeft, w:on.offsetWidth};
    if (!ind){
      ind = document.createElement("i"); ind.className = "seg-ind"; ind.setAttribute("aria-hidden","true"); seg.prepend(ind);
      const from = SEG_POS.get(key);
      ind.style.transition = "none";
      ind.style.transform = `translateX(${(from||to).x}px)`; ind.style.width = (from||to).w + "px";
      void ind.offsetWidth; ind.style.transition = "";
    }
    seg.classList.add("glide");
    ind.style.transform = `translateX(${to.x}px)`; ind.style.width = to.w + "px";
    SEG_POS.set(key, to);
  });
}
function glideNav(){
  document.querySelectorAll("nav.side, nav.bottom").forEach(nav=>{
    const on = nav.querySelector(".tab.on"); if (!on || !nav.offsetParent && getComputedStyle(nav).display==="none") return;
    let ind = nav.querySelector(":scope > .nav-ind");
    if (!ind){ ind = document.createElement("i"); ind.className = "nav-ind"; ind.setAttribute("aria-hidden","true"); nav.prepend(ind); }
    nav.classList.add("glide");
    ind.style.width = on.offsetWidth + "px"; ind.style.height = on.offsetHeight + "px";
    ind.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`; ind.style.opacity = "1";
  });
}
addEventListener("resize", ()=>{ glideNav(); glideSegs(); });
if (document.fonts) document.fonts.ready.then(()=>{ glideNav(); glideSegs(); });

/* ---------------- Воронка ---------------- */
async function viewFunnel(v){
  setTitle("Воронка", "Кто где застрял — по людям, пришедшим за период");
  const plats = ["all", ...S.meta.platforms];
  const d = await api(`/api/funnel?period=${S.period}&platform=${encodeURIComponent(S.platform)}`);
  const max = Math.max(1, ...d.stages.map(s=>s.count));
  const drop = d.biggest_drop;
  v.innerHTML = `
  <div class="row" style="margin-bottom:10px">
    <div class="seg">${PERIODS.map(([k,n])=>`<button data-p="${k}" class="${S.period===k?"on":""}">${n}</button>`).join("")}</div>

/* ---------- выгрузка в Excel / CSV ---------- */
function exportButtons(what){
  return `<div class="row exp" style="gap:8px"><span class="muted" style="font-size:13px">Выгрузить ${what}:</span>
    <button class="btn small ghost" data-exp="xlsx" title="Таблица Excel: каждая часть на своём листе">⬇ Excel</button>
    <button class="btn small ghost" data-exp="csv" title="CSV: те же таблицы подряд, разделитель «;»">⬇ CSV</button></div>`;
}
async function downloadExport(what, fmt, period, platform, btn){
  if (btn){ btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = "Готовлю…"; }
  try{
    const opt = {credentials:"same-origin", headers:{}};
    if (S.token) opt.headers.Authorization = "Bearer " + S.token;
    const r = await fetch(`/api/export?what=${what}&fmt=${fmt}&period=${encodeURIComponent(period||"30")}&platform=${encodeURIComponent(platform||"all")}`, opt);
    if (r.status === 401){ renderLogin(); return; }
    if (!r.ok){ let e = {}; try{ e = await r.json(); }catch(_){} throw new Error(e.error || ("Ошибка " + r.status)); }
    const blob = await r.blob();
    const m = (r.headers.get("Content-Disposition")||"").match(/filename\*=UTF-8''([^;]+)/);
    const name = m ? decodeURIComponent(m[1]) : `export.${fmt}`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast("Файл готов: " + name);
  }catch(e){ toast(e.message); }
  finally{ if (btn){ btn.disabled = false; btn.textContent = btn.dataset.t; } }
}
function bindTips(v){
  const tip = $("#tip");
  v.querySelectorAll("[data-tip]").forEach(el=>{
    el.onmousemove = e => { tip.innerHTML = el.dataset.tip; tip.style.display="block";
      tip.style.left = Math.min(e.clientX+14, innerWidth-270)+"px"; tip.style.top = (e.clientY+14)+"px"; };
    el.onmouseleave = () => tip.style.display="none";
  });
}

(function cursorLight(){
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const root = document.documentElement;
  let tx=0, ty=0, x=null, y=null, raf=0;
  const step = () => {
    const k = REDUCED.matches ? 1 : .18;
    x += (tx-x)*k; y += (ty-y)*k;
    root.style.setProperty("--mx", x.toFixed(1)+"px"); root.style.setProperty("--my", y.toFixed(1)+"px");
    raf = Math.abs(tx-x) + Math.abs(ty-y) > .4 ? requestAnimationFrame(step) : 0;
  };
  addEventListener("pointermove", e => {
    if (e.pointerType && e.pointerType !== "mouse") return;
    tx = e.clientX; ty = e.clientY; if (x===null){ x=tx; y=ty; }
    root.style.setProperty("--glow-o", "1");
    if (!raf) raf = requestAnimationFrame(step);
  }, {passive:true});
  root.addEventListener("mouseleave", () => root.style.setProperty("--glow-o", "0"));
  addEventListener("blur", () => root.style.setProperty("--glow-o", "0"));
})();

        const r = await api("/api/pack/file",{code:orig, token, name:f.name}); p.files = r.pack.files; files(); pv();
      }catch(err){ $("#gstat").textContent = "⚠️ " + err.message; }
    }
    $("#gprog").style.display="none"; if (!$("#gstat").textContent.startsWith("⚠️")) $("#gstat").textContent = p.files.length ? "✅ Файлы в наборе" : "";
  };
  $("#gsave").onclick = async () => { read(); $("#gerr").textContent="";
    try{ await api("/api/pack", Object.assign({}, p, {old_code:orig})); toast("Сохранено"); closeSheet(); render(); }catch(e){ $("#gerr").textContent = e.message; } };
  $("#gdel").onclick = async () => { if (!confirm("Удалить набор и его файлы? Ссылка перестанет выдавать файлы.")) return; await api("/api/pack/delete",{code:orig}); closeSheet(); render(); };
}
async function chunkUpload(f, onp){
  const {token} = await api("/api/upload/start", {name:f.name, size:f.size});
  const CH = 4*1024*1024; let off = 0, fails = 0;
  while (off < f.size){
    try{
      const opt = {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/octet-stream"}, body:f.slice(off, off+CH)};
      if (S.token) opt.headers.Authorization = "Bearer " + S.token;
      const r = await fetch(`/api/upload/chunk?token=${token}&offset=${off}`, opt);
      if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ("HTTP "+r.status));
      off = (await r.json()).got; fails = 0;
    }catch(e){ if (++fails > 5) throw e; await new Promise(r=>setTimeout(r, 1500*fails)); }
    onp(Math.round(off*100/Math.max(1,f.size)));
  }
  await api("/api/upload/finish", {token});
  return token;
}

function shortNum(n){ n = +n||0; if (n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(".0","")+" млн"; if (n>=1e4) return Math.round(n/1e3)+" тыс."; return fmt(n); }
function dayLabel(d){ const [y,m,dd] = d.split("-"); return `${dd}.${m}`; }
function areaChart(points, {h=90, tip=(p)=>""}={}){
  // points: [{x:number, y:number, label:string}]
  if (!points.length) return `<div class="muted" style="font-size:13px;padding:18px 0">Пока нет данных</div>`;
  const W = 600, H = h, pad = 4;
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, ymax = Math.max(1, ...ys);
  const X = x => pad + (x1===x0 ? (W-2*pad)/2 : (x-x0)/(x1-x0)*(W-2*pad));
  const Y = y => H - 3 - (y/ymax)*(H-12);
  // плавная кривая (сплайн Катмулла — Рома → кривые Безье), не выходит за пределы графика
  const P = points.map(p=>[X(p.x), Y(p.y)]);
  const clampY = y => Math.max(2, Math.min(H-1, y));
  let line = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i=0; i<P.length-1; i++){
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2;
    line += `C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${clampY(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${clampY(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${line}L${X(points[points.length-1].x).toFixed(1)},${H}L${X(points[0].x).toFixed(1)},${H}Z`;
  const step = (W-2*pad)/Math.max(1, points.length-1);
  const hits = points.map((p,i)=>`<rect x="${Math.max(0, X(p.x)-step/2).toFixed(1)}" y="0" width="${Math.min(step, W-Math.max(0, X(p.x)-step/2)).toFixed(1)}" height="${H}" fill="transparent" data-tip="${esc(tip(p))}" data-cx="${(X(p.x)/W*100).toFixed(2)}"></rect>`).join("");
  const last = points[points.length-1];
  return `<div class="chartbox"><div class="ymax">${shortNum(ymax)}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="area" role="img" aria-label="График">
      <line x1="0" y1="${H-1}" x2="${W}" y2="${H-1}" class="axis"/>
      <path d="${area}" class="fillp"/><path d="${line}" class="linep" vector-effect="non-scaling-stroke"/>
      <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="3.5" class="dotp" vector-effect="non-scaling-stroke"/>
      ${hits}</svg><div class="cross"></div>
    <div class="xl"><span>${esc(points[0].label)}</span><span>${esc(last.label)}</span></div></div>`;
}
function bindCharts(v){

    });
    box.addEventListener("mouseleave",()=>cr.style.display="none");
  });
}
function spark(pts){
  if (!pts || pts.length<2) return "";
  const W=90,H=26, mn=Math.min(...pts), mx=Math.max(...pts), r=(mx-mn)||1;
  const d = pts.map((p,i)=>`${i?"L":"M"}${(i/(pts.length-1)*W).toFixed(1)},${(H-2-(p-mn)/r*(H-4)).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="spark" aria-hidden="true"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}

async function viewVideos(v){
  setTitle("Ролики", "Просмотры под каждым роликом и как он растёт");
  S.vplat = S.vplat || "all"; S.vsort = S.vsort || "new";
  const d = await api(`/api/videos?platform=${encodeURIComponent(S.vplat)}`);
  const all = d.items;
  v.innerHTML = `
  <div class="row" style="margin-bottom:10px"><input class="search" id="vq" placeholder="Поиск по названию">
    <select class="field" id="vsort" style="width:auto"><option value="new">Сначала новые</option><option value="views">Больше просмотров</option><option value="growth">Быстрее растут</option><option value="people">Больше людей в бота</option><option value="er">Выше вовлечённость</option></select></div>
  <div class="chips" style="margin-bottom:12px">${["all","YouTube","TikTok","Instagram","VK","X"].map(p=>`<button class="chip ${S.vplat===p?"on":""}" data-vp="${p}">${p==="all"?"Все":p}</button>`).join("")}</div>
  <div class="glass card"><div class="muted" id="vcount" style="font-size:13px"></div><div class="list" id="vlist"></div><div id="vmore" style="text-align:center"></div></div>`;
  $("#vsort").value = S.vsort;
  let shown = 60;
  const draw = () => {
    const q = ($("#vq").value||"").toLowerCase();
    let list = all.filter(x => !q || (x.title||"").toLowerCase().includes(q) || x.code.toLowerCase().includes(q));
    const key = {new:x=>x.published_at||0, views:x=>x.views, growth:x=>x.gained_7d||0, people:x=>x.people, er:x=>x.er}[S.vsort];
    list = list.slice().sort((a,b)=>key(b)-key(a));
    $("#vcount").textContent = `Роликов: ${fmt(list.length)}`;
    $("#vlist").innerHTML = list.length ? list.slice(0,shown).map(x=>`
      <div class="item vrow" data-vcode="${esc(x.code)}">
        ${pic(x.platform)}
        <div class="main"><div class="t">${esc(x.title||x.code)}</div>
          <div class="s">${x.published_at?dateStr(x.published_at,false):""} · ${esc(x.kind||"")} · ❤ ${shortNum(x.likes)} · 💬 ${shortNum(x.comments)} · ${x.er}%${x.people?` · <b style="color:var(--good)">${fmt(x.people)} в бота</b>`:""}${x.no_link&&S.meta.ws_main?` · <span style="color:var(--warn)">не связан с ботом</span>`:""}</div></div>
        <div class="vspark">${spark(x.spark)}</div>
        <div class="r"><div class="vv">${shortNum(x.views)}</div>${x.fresh?`<span class="pill acc">новый</span>`:""}${x.x_typical?`<span class="pill ${x.x_typical>=1.5?"good":x.x_typical<0.6?"warn":""}">×${x.x_typical}</span>`:""}</div>
      </div>`).join("") : `<div class="empty">Роликов пока нет. Подключи YouTube, TikTok, Instagram или VK в «Настройках» — они появятся здесь сами.</div>`;
    $("#vlist").querySelectorAll("[data-vcode]").forEach(el=>el.onclick=()=>openVideo(el.dataset.vcode));
    $("#vmore").innerHTML = list.length>shown?`<button class="btn ghost small mt8" id="vm">Показать ещё</button>`:"";
    if ($("#vm")) $("#vm").onclick=()=>{ shown+=60; draw(); };
  };
  $("#vq").oninput = draw; $("#vsort").onchange = e=>{ S.vsort=e.target.value; draw(); };
  v.querySelectorAll("[data-vp]").forEach(b=>b.onclick=()=>{ S.vplat=b.dataset.vp; viewVideos(v); });
  draw();
}
async function openVideo(code){
  openSheet(`<div class="empty">Загрузка…</div>`);
  let x; try{ x = await api("/api/video?code="+encodeURIComponent(code)); }catch(e){ return; }
  const pts = x.history.map(h=>({x:h.at, y:h.views, label:dateStr(h.at)}));
  const lines = [];
  if (x.fresh && x.typical) lines.push(`Ролику меньше 2 дней — он ещё набирает. Обычный ролик в ${esc(x.platform)} в итоге набирает ${shortNum(x.typical)}, сейчас у этого ${fmt(x.views||0)}.`);
  else if (x.x_typical) lines.push(`Набрал <b>${fmt(x.views)}</b> просмотров — ${x.x_typical>=1?`в <b>${x.x_typical}</b> раза больше`:`<b>${Math.round(x.x_typical*100)}%</b> от`} обычного ролика в ${esc(x.platform)} (${shortNum(x.typical)}).`);
  else lines.push(`Набрал <b>${fmt(x.views||0)}</b> просмотров.`);
  if (x.day1!=null) lines.push(`За первые сутки — ${fmt(x.day1)}.`);
  if (x.views) lines.push(`Вовлечённость ${x.er}%: ${x.er>=4?"зрители активно реагируют — хороший знак для алгоритма.":"нормально 2–6%; вопрос к зрителям в конце поможет."}`);
  lines.push(x.people ? `Привёл в бота <b>${fmt(x.people)}</b> чел.${x.per_person?` (1 человек на ${shortNum(x.per_person)} просмотров)`:""}, лид-магнит взяли ${fmt(x.gift)}, тестировали ${fmt(x.test)}, оплатили ${fmt(x.paid)}.`
    : (x.synced && x.ext_id && x.code.endsWith((x.ext_id.split(":")[1]||"").split("_").pop()) ? "Ролик не связан с ботом: в описании нет ссылки с меткой и в подписи нет кодового слова." : "В бота с этого ролика пока никто не пришёл."));
  openSheet(`
    <div class="row">${pic(x.platform)}<h2 style="font-size:17px;flex:1">${esc(x.title||x.code)}</h2><button class="iconbtn" data-close>${ICON.close}</button></div>
    <div class="row mt8"><span class="pill">${esc(x.platform)} · ${esc(x.kind||"")}</span><span class="code">${esc(x.code)}</span>${x.published_at?`<span class="muted" style="font-size:13px">вышел ${dateStr(x.published_at,false)}${x.age_days!=null?` · ${x.age_days} дн. назад`:""}</span>`:""}</div>
    <div class="nums mt12"><div><b>${shortNum(x.views)}</b><span>просмотры</span></div><div><b>${shortNum(x.likes)}</b><span>лайки</span></div><div><b>${shortNum(x.comments)}</b><span>комменты</span></div><div><b>${fmt(x.people)}</b><span>в бота</span></div></div>
    <div class="blk"><div class="lbl">Как рос</div>${pts.length>=2?areaChart(pts,{h:110,tip:p=>`${p.label}: ${fmt(p.y)} просмотров`}):`<div class="muted" style="font-size:13px">График появится после следующих обновлений (каждые 3 часа).</div>`}</div>
    <div class="blk"><div class="lbl">Простыми словами</div><div class="ins">${lines.map(l=>`<div class="insi info"><span>•</span><div>${l}</div></div>`).join("")}</div></div>
    <div class="row mt12">${x.url?`<a class="btn ghost" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть ролик</a>`:""}<button class="btn ghost" id="vpeople">Люди с ролика</button></div>`);
  $("#vpeople").onclick = () => { closeSheet(); go("people",{status:"",stage:"",platform:"all",q:"",source:code,period:"all"}); };
  bindCharts($("#sheet"));
}

async function postForm(){
  const d = S.pubmeta;
  const F = {ptype:"video", files:[], platforms:new Set(d.default_platforms), captions:null, codes:{}, kind:null, meta:{}, prevTab:null, adult:""};
  let names = {};
  try{ const so = await api("/api/social");
    Object.keys(PUB).forEach(k=>{ const a = ((so[k]||{}).accounts||[])[0]; if (a) names[k] = a.name; });
    names.tg = d.post_channel || names.tg; }catch(e){}
  const ACC = k => (names[k]||"").toString().replace(/^@/,"") || (S.meta.ws_name || "Твой аккаунт");

  $("#ffile").onchange = async e => {
    const list = [...e.target.files]; e.target.value = ""; if (!list.length) return;
    if (F.ptype !== "image") F.files = [];
    for (const f of list.slice(0, F.ptype==="image" ? 10 - F.files.length : 1)){
      const item = {file:f, url:URL.createObjectURL(f), name:f.name, isVideo:f.type.startsWith("video/"), pct:0};
      F.files.push(item);
      if (item.isVideo){ const vid = document.createElement("video"); vid.preload="metadata"; vid.src=item.url;
        vid.onloadedmetadata = () => { item.width=vid.videoWidth; item.height=vid.videoHeight; item.duration=vid.duration;
          if (F.ptype==="video"){ F.meta={duration:vid.duration}; setKind(vid.duration<=180 && vid.videoHeight>=vid.videoWidth ? "short" : "long");
            $("#droptxt").textContent = `${fmtDur(vid.duration)} · ${(f.size/1048576).toFixed(0)} МБ — заменить`; } renderPreview(); }; }
      else { const im = new Image(); im.onload = () => { item.width=im.naturalWidth; item.height=im.naturalHeight; renderPreview(); }; im.src = item.url; }
    }
    if (F.ptype==="video" && !F.kind) setKind(list[0].size < 200*1048576 ? "short" : "long");
    if (F.ptype==="image") $("#droptxt").textContent = F.files.length >= 10 ? "Максимум 10 фото" : "🖼 Добавить ещё фото";
    else if (F.ptype==="gif") $("#droptxt").textContent = `${list[0].name} — заменить`;
    drawThumbs(); renderPreview(); upd();
    for (const item of F.files.filter(x=>!x.token && !x.busy)) await uploadOne(item, drawThumbs, upd);
  };
  $("#fkwgen").onclick = () => { const w = (($("#ftitle").value||$("#ftext").value).match(/[A-Za-zА-Яа-яЁё]{4,}/g)||["ПОДАРОК"]); const pick = w.find(x=>x.length<=10)||w[0];
    $("#fkw").value = pick.toUpperCase().slice(0,10) + (Math.floor(Math.random()*90)+10); refreshCaps(); };
  ["ftitle","ftext","fkw"].forEach(id=>$("#"+id).addEventListener("input",()=>{ refreshCaps(); upd(); }));
  sh.querySelectorAll("[data-when]").forEach(b=>b.onclick=()=>{ S.when=b.dataset.when; sh.querySelectorAll("[data-when]").forEach(x=>x.classList.toggle("on",x===b));
    $("#fat").style.display = S.when==="later"?"block":"none"; if (S.when==="later" && !$("#fat").value){ const t=new Date(Date.now()+3600e3); t.setMinutes(0); $("#fat").value=new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,16);} upd(); });
  // подписи с сервера (метки, ссылки, кодовое слово) — с задержкой, чтобы не дёргать сервер на каждую букву
  let capTimer;
  function refreshCaps(){ clearTimeout(capTimer); capTimer = setTimeout(async () => {
    const f0 = F.files[0]||{};
    try{ const r = await api("/api/post/preview", {ptype:F.ptype, title:$("#ftitle").value, text:$("#ftext").value, keyword:$("#fkw").value, tags:$("#ftags").value,
        platforms:plats(), kind:F.kind, width:f0.width, height:f0.height, duration:F.meta.duration});
      const old = F.captions || {};
      F.captions = Object.fromEntries(Object.entries(r.captions).map(([k,c]) => [k, old[k] && old[k]._edited ? old[k] : c]));
      F.codes = r.codes; drawCapEditors(); renderPreview();
    }catch(e){} }, 350); }
  function drawCapEditors(){
    $("#fcaps").innerHTML = Object.entries(F.captions||{}).map(([k,c])=>`<div class="capbox"><b>${PUB[k]}</b> <span class="code">${esc(F.codes[k]||"")}</span>${c._edited?` <span class="pill acc">изменено</span>`:""}
      ${c.title!=null?`<input class="field mt8" data-cap="${k}" data-f="title" value="${esc(c.title)}">`:""}
      <textarea class="field mt8" data-cap="${k}" data-f="text" rows="4">${esc(k==="tg"?pvPlain(c.text):c.text)}</textarea></div>`).join("");
    $("#fcaps").querySelectorAll("[data-cap]").forEach(el=>el.oninput=()=>{ const c=F.captions[el.dataset.cap];
      c[el.dataset.f] = el.dataset.cap==="tg"&&el.dataset.f==="text" ? el.value.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : el.value; c._edited=true; renderPreview(); });

    const ps = plats();
    if (!ps.length){ $("#fprevtabs").innerHTML=""; $("#fpreview").innerHTML = `<div class="muted" style="font-size:13px">Выбери соцсети — здесь появится превью.</div>`; return; }
    if (!ps.includes(F.prevTab)) F.prevTab = ps[0];
    $("#fprevtabs").innerHTML = ps.map(p=>`<button class="chip ${F.prevTab===p?"on":""}" data-pv="${p}">${pic(p,"sm",0)}${PUB[p]}</button>`).join("");
    $("#fprevtabs").querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>{ F.prevTab=b.dataset.pv; renderPreview(); });
    const cap = (F.captions||{})[F.prevTab] || {text:$("#ftext").value, title:$("#ftitle").value};
    $("#fpreview").innerHTML = pvRender(F.prevTab, {cap, files:F.files, ptype:F.ptype, kind:F.kind, acc:ACC(F.prevTab), title:$("#ftitle").value, bot:S.meta.ws_main, adult:F.adult, tags:$("#ftags").value});
    $("#fpreview").querySelectorAll("video").forEach(v=>{ v.muted=true; v.play&&v.play().catch(()=>{}); });
  }
  $("#fgo").onclick = async () => {
    $("#fgo").disabled = true; $("#ferr").textContent = "";
    const body = {ptype:F.ptype, files:F.files.filter(f=>f.token).map(f=>({token:f.token, name:f.name, width:f.width, height:f.height})),
      title:$("#ftitle").value, text:$("#ftext").value, keyword:$("#fkw").value, platforms:plats().filter(p=>mode(p)), kind:F.kind, duration:F.meta.duration,
      adult:F.adult, tags:$("#ftags").value, source:$("#fsource").value};
    if (S.when==="later") body.publish_at = Math.floor(new Date($("#fat").value).getTime()/1000);
    if (F.captions) body.captions = Object.fromEntries(Object.entries(F.captions).filter(([k,c])=>c._edited).map(([k,c])=>[k,{title:c.title,text:c.text}]));
    try{ const r = await api("/api/post", body); toast(S.when==="later"?"Запланировано":"Публикую"); closeSheet(); go("publish"); setTimeout(()=>openPost(r.id), 400); }
    catch(e){ $("#ferr").textContent = e.message; upd(); }
