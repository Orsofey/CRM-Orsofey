async function uploadOne(item, redraw, upd){
  item.busy = true;
  const st = $("#fstat"), bar = $("#fprog");
  bar.style.display = "block";
  try{
    const f = item.file;
    const {token} = await api("/api/upload/start", {name:f.name, size:f.size});
    const CH = 4*1024*1024; let off = 0, fails = 0;
    while (off < f.size){
      try{
        const opt = {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/octet-stream"}, body:f.slice(off, off+CH)};
        if (S.token) opt.headers.Authorization = "Bearer " + S.token;
        const r = await fetch(`/api/upload/chunk?token=${token}&offset=${off}`, opt);
        if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ("HTTP "+r.status));
        off = (await r.json()).got; fails = 0;
      }catch(e){ if (++fails > 5) throw e; st.textContent = "Связь прервалась, продолжаю…"; await new Promise(r=>setTimeout(r, 1500*fails)); }
      item.pct = Math.round(off*100/f.size); bar.firstElementChild.style.width = item.pct+"%";
      st.textContent = `Загружаю «${item.name}»: ${item.pct}% (${(off/1048576).toFixed(1)} из ${(f.size/1048576).toFixed(1)} МБ)`; redraw();
    }
    await api("/api/upload/finish", {token}); item.token = token; st.textContent = "✅ Загружено";
  }catch(e){ item.error = true; st.textContent = "⚠️ " + e.message + " — выбери файл ещё раз"; }
  item.busy = false; redraw(); upd();
}

/* ---------------- Превью: как пост выглядит в каждой соцсети ---------------- */
function pvPlain(s){ return (s||"").replace(/<\/?b>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&"); }
function pvText(s, {html=false, more=0}={}){
  let t = html ? s : esc(s||"");
  if (!html) t = t.replace(/\n/g,"<br>");
  else t = t.replace(/\n/g,"<br>");
  t = t.replace(/(https?:\/\/[^\s<]+)/g,'<span class="pv-link">$1</span>').replace(/(^|\s)(#[\wА-Яа-яЁё]+)/g,'$1<span class="pv-link">$2</span>');
  return t;
}
function pvClip(s, n){ s = s||""; return s.length > n ? esc(s.slice(0,n)).replace(/\n/g,"<br>") + `… <span class="pv-more">ещё</span>` : pvText(s); }
function pvMedia(files, cls="", max=10){
  if (!files.length) return "";
  const one = f => f.isVideo ? `<video src="${f.url}" muted loop playsinline autoplay></video>` : `<img src="${f.url}" alt="">`;
  if (files.length === 1) return `<div class="pv-media ${cls}">${one(files[0])}</div>`;
  const shown = files.slice(0, max);
  return `<div class="pv-grid n${Math.min(shown.length,4)} ${cls}">${shown.slice(0,4).map((f,i)=>`<div>${one(f)}${i===3&&files.length>4?`<span class="pv-plus">+${files.length-4}</span>`:""}</div>`).join("")}</div>`;
}
function pvAva(name, cls=""){ return `<span class="pv-ava ${cls}">${esc((name||"?").replace(/^@/,"").slice(0,1).toUpperCase())}</span>`; }
function pvRender(p, o){
  const {cap, files, ptype, kind, acc} = o;
  const text = pvPlain(cap.text||""), title = cap.title || o.title || "";
  const vertical = ptype==="video" ? kind!=="long" : files[0] && files[0].height > files[0].width;
  const count = (n, lim, label) => `<div class="pv-count ${n>lim?"over":""}">${n} / ${lim}${n>lim?` — ${label}`:""}</div>`;
  if (p === "tg"){
    const long = ptype!=="text" && text.length > 1024;
    return `<div class="pv pv-tg"><div class="pv-tg-head">${pvAva(acc)}<div><b>${esc(o.adult?"канал 18+":acc)}</b><div class="pv-sub">канал</div></div></div>
      <div class="pv-tg-bubble"><div class="${o.adult?"pv-blur":""}">${pvMedia(files, "tgm")}</div><div class="pv-tg-text">${long?"":pvText(cap.text||"", {html:true})}</div>
      <div class="pv-tg-meta">👁 1 · сейчас</div></div>
      ${long?`<div class="pv-tg-bubble"><div class="pv-tg-text">${pvText(cap.text||"", {html:true})}</div><div class="pv-tg-meta">отдельным сообщением — подпись к медиа до 1024 знаков</div></div>`:""}
      ${o.bot?`<div class="pv-tg-btn">🎁 Забрать подарок</div>`:""}</div>`;
  }
  if (p === "ig"){
    return `<div class="pv pv-ig"><div class="pv-row">${pvAva(acc,"ring")}<b>${esc(acc)}</b><span class="spacer"></span>⋯</div>
      ${pvMedia(files.slice(0,1), vertical ? "r45" : "r11")}
      ${files.length>1?`<div class="pv-dots">${files.slice(0,10).map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}
      <div class="pv-row pv-icons">♡ <span>💬</span> <span>➤</span><span class="spacer"></span>⌑</div>
      <div class="pv-cap"><b>${esc(acc)}</b> ${pvClip(text, 125)}</div>${count(text.length, 2200, "Instagram обрежет")}</div>`;
  }
  if (p === "tt"){
    return `<div class="pv pv-tt">${pvMedia(files.slice(0,1), "fill")}${files.length>1?`<div class="pv-tt-badge">1/${files.length}</div>`:""}
      <div class="pv-tt-side"><span>${pvAva(acc)}</span><span>♥<small>0</small></span><span>💬<small>0</small></span><span>↗<small>0</small></span></div>
      <div class="pv-tt-cap"><b>@${esc(acc)}</b><div>${pvClip(text, 90)}</div></div></div>`;
  }
  if (p === "yt"){
    if (ptype==="video" && kind!=="long") return `<div class="pv pv-tt pv-ys">${pvMedia(files.slice(0,1), "fill")}
      <div class="pv-tt-side"><span>👍<small>0</small></span><span>👎</span><span>💬<small>0</small></span><span>↗</span></div>
      <div class="pv-tt-cap"><div class="pv-row">${pvAva(acc)}<b>@${esc(acc)}</b><span class="pv-sub-btn">Подписаться</span></div><div>${esc(title)}</div></div></div>`;
    if (ptype==="video") return `<div class="pv pv-yt">${pvMedia(files.slice(0,1), "r169")}<div class="pv-row" style="align-items:flex-start;margin-top:10px">${pvAva(acc)}

async function openPost(id){
  let p; try{ p = await api("/api/post?id="+id); }catch(e){ return; }
  const live = p.targets.some(t=>["queued","processing"].includes(t.status));
  const t = p.ptype||"video";
  const media = !p.media.length ? (t==="text" ? "" : `<div class="muted mt8" style="font-size:13px">Файлы удалены с сервера после публикации (место на диске).</div>`)
    : t==="video" ? `<video src="${esc(p.media[0].url)}" controls playsinline preload="metadata" class="pvid"></video>`
    : `<div class="thumbs mt8">${p.media.map(m=>`<a class="thumb" href="${esc(m.url)}" target="_blank" rel="noopener"><img src="${esc(m.url)}" alt=""></a>`).join("")}</div>`;
  openSheet(`
    <div class="row"><h2 style="flex:1;font-size:18px">${PT_ICON[t]} ${esc(p.title||p.text.slice(0,60)||"Публикация")}</h2><button class="iconbtn" data-close>${ICON.close}</button></div>
    <div class="muted mt8" style="font-size:13px">${t==="video"?(p.kind==="short"?"Шортс":"Длинное видео")+(p.duration?" · "+fmtDur(p.duration):""):(S.pubmeta?S.pubmeta.ptypes[t]:t)}${p.media.length>1?` · ${p.media.length} шт.`:""} · ${p.publish_at>Date.now()/1000?"выйдет "+dateStr(p.publish_at):"с "+dateStr(p.publish_at)}${p.keyword?` · слово <b>${esc(p.keyword)}</b>`:""}</div>
    ${media}
    ${p.targets.map(x=>targetCard(x,p)).join("")}
    <div class="row mt12"><button class="btn ghost" id="pcheck">Проверить, вышли ли посты</button><div class="spacer"></div><button class="btn small danger" id="pdel">Удалить</button></div>
    <div class="muted" style="font-size:12.5px;margin-top:6px">CRM сама проверяет соцсети каждые 3 часа и отмечает «Опубликовано», когда найдёт пост по метке, кодовому слову или заголовку.</div>`);
  const sh = $("#sheet");
  sh.querySelectorAll("[data-copytext]").forEach(b=>b.onclick=()=>copy(b.dataset.copytext));
  sh.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{ const url = prompt("Ссылка на опубликованный пост (можно пропустить):","")||""; await api("/api/post/target",{id:+b.dataset.done, action:"done", url}); openPost(id); });
  sh.querySelectorAll("[data-auto]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await api("/api/post/target",{id:+b.dataset.auto, action:"auto"}); toast("Публикую сам — займёт до минуты"); }catch(e){ toast(e.message); } openPost(id); });
  sh.querySelectorAll("[data-retry]").forEach(b=>b.onclick=async()=>{ await api("/api/post/target",{id:+b.dataset.retry, action:"retry"}); toast("Пробую ещё раз"); openPost(id); });
  $("#pcheck").onclick = async () => { $("#pcheck").disabled=true; $("#pcheck").textContent="Проверяю…"; try{ await api("/api/post/check",{id}); }catch(e){ toast(e.message); } openPost(id); };
  $("#pdel").onclick = async () => { if (!confirm("Удалить публикацию из CRM? В соцсетях ничего не удалится.")) return; await api("/api/post/delete",{id}); closeSheet(); render(); };
  if (live) setTimeout(()=>{ if ($("#sheet").classList.contains("open") && $("#pcheck")) openPost(id); }, 15000);
}

    const k = b.dataset.oaPub, c = PUBA[k];
    try{ const idEl = v.querySelector(`[data-pub-id=${k}]`);
      if (idEl && idEl.value.trim()){ const body = {[c.idField]: idEl.value.trim()}; const sec = v.querySelector(`[data-pub-sec=${k}]`).value.trim(); if (sec) body[c.secField] = sec; await api("/api/social", body); }
      const r = await api("/api/social/oauth", {platform: c.plat}); location.href = r.url; }catch(e){ toast(e.message); } });
  if ($("#ttstats")) $("#ttstats").onchange = async () => { await api("/api/social", {tt_stats: $("#ttstats").checked}); toast($("#ttstats").checked ? "Теперь нажми «Войти через TikTok» — TikTok спросит доступ к статистике профиля" : "Выключено"); };
  if ($("#ttpub")) $("#ttpub").onchange = async () => { await api("/api/social", {tt_publish: $("#ttpub").checked}); toast($("#ttpub").checked ? "Теперь нажми «Войти через TikTok» — TikTok спросит разрешение на публикацию" : "Публикация в TikTok выключена"); };
  if ($("#manualtg")) $("#manualtg").onchange = async () => { await api("/api/social", {manual_tg: $("#manualtg").checked}); toast($("#manualtg").checked ? "Буду присылать в Telegram" : "Больше не присылаю — всё в карточке поста"); };
  v.querySelectorAll("[data-oa-plat]").forEach(b => b.onclick = async () => {
    try{ const r = await api("/api/social/oauth", {platform: b.dataset.oaPlat}); location.href = r.url; }catch(e){ toast(e.message); } });
  if ($("#sproxysave")) $("#sproxysave").onclick = async () => { const val=$("#sproxy").value.trim(); if(!val) return; await api("/api/social",{social_proxy:val}); toast("Прокси сохранён"); re(); };
  if ($("#sproxyoff")) $("#sproxyoff").onclick = async () => { await api("/api/social",{social_proxy:""}); toast("Прокси убран"); re(); };
}

/* ---------------- Вход ---------------- */
function renderLogin(){
  closeSheet();
  const expired = location.search.includes("expired");
  $("#root").innerHTML = `<div class="glass login">
    <div class="brand" style="padding:0 0 14px"><div class="mark">${ICON.funnel.replace('stroke="currentColor"','stroke="#fff"')}</div><div>Orsofey CRM<small>воронка бота</small></div></div>
    <h1>Вход</h1>
    <p class="muted" style="margin:0 0 14px">Отправь боту команду <b>/panel</b> — он пришлёт код из 6 цифр.${expired?"<br>Ссылка устарела — запроси новую.":""}</p>
    <input class="field codein" id="lc" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
    <button class="btn mt12" id="lb" style="width:100%">Войти</button>
    <details class="mt12"><summary class="muted" style="cursor:pointer;font-size:13px">Войти по паролю</summary>
      <input class="field mt8" id="lp" type="password" placeholder="PANEL_PASSWORD"><button class="btn ghost mt8" id="lpb">Войти</button></details>
    <p class="muted" id="lerr" style="color:var(--bad);font-size:13px"></p>
  </div>`;
  const doLogin = async body => {
    try{ const r = await api("/api/login", body); S.token = r.token; try{ localStorage.setItem("crm_token", r.token); }catch(e){} boot(); }
    catch(e){ $("#lerr").textContent = e.message; }
  };
  $("#lb").onclick = () => doLogin({code:$("#lc").value});
  $("#lc").oninput = e => { if (e.target.value.length===6) doLogin({code:e.target.value}); };
  $("#lpb").onclick = () => doLogin({password:$("#lp").value});
}

async function boot(){
  try{ S.meta = await api("/api/meta"); }catch(e){ if (e.message!=="auth") $("#root").innerHTML = `<div class="glass login">Сервер недоступен: ${esc(e.message)}</div>`; return; }
  TABS = ALL_TABS.slice(); SUBS = JSON.parse(JSON.stringify(ALL_SUBS));
  if (!S.meta.ws_main){        // своя CRM друга: без воронки бота, людей и меток
    TABS = TABS.filter(t => ["analytics","publish","settings"].includes(t[0]));
    SUBS.analytics = SUBS.analytics.filter(x => x[0] !== "labels");
    if (!TABS.some(t=>t[0]===S.tab)) S.tab = "analytics";
  }
  try{ S.mainToken = S.mainToken || localStorage.getItem("crm_main_token"); }catch(e){}
  shell(); render();
  if (!S.meta.ws_main && S.mainToken){
    const bar = document.createElement("div"); bar.className = "asbar";
    bar.innerHTML = `<span>Ты настраиваешь CRM: <b>${esc(S.meta.ws_name||"клиента")}</b></span><button class="btn small" id="asback">← В мою CRM</button>`;
    $("main").prepend(bar);
    $("#asback").onclick = () => { S.token = S.mainToken; S.mainToken = null;
      try{ localStorage.setItem("crm_token", S.token); localStorage.removeItem("crm_main_token"); }catch(e){}
      TABS = ALL_TABS.slice(); SUBS = JSON.parse(JSON.stringify(ALL_SUBS)); S.tab = "settings"; boot(); };
  }
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window._installPrompt = e; });
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("/sw.js").catch(()=>{});
boot();
</script>
